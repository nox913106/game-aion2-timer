  --vh:1vh;              /* 由 JS 依實際可視高度覆寫，見 syncViewport() */
  --tabh:56px;           /* 底部分頁列高度 */
  --ink:#150E1E; --panel:#1E1429; --panel-2:#261A33; --edge:#3A2B4B;
  color-scheme:dark;
  --fill-1:rgba(30,20,41,.78);        /* 清單列 */
  --fill-2:rgba(38,26,51,.80);        /* 卡片、主面板上緣 */
  --fill-3:rgba(30,20,41,.86);        /* 主面板下緣 */
  --toast-fill:rgba(38,26,51,.93);
  --field:rgba(0,0,0,.25);            /* 輸入框 */
  --track:rgba(0,0,0,.33);            /* 進度軌 */
  --hover:rgba(255,255,255,.06);
  --shadow:rgba(0,0,0,.35);
  --tabbar-h:0px;                 /* 分頁列高度，觸控版面才有值 */
  --scrim:linear-gradient(180deg, rgba(12,8,18,.72) 0%, rgba(12,8,18,.85) 55%, rgba(12,8,18,.93) 100%);
  --glow:radial-gradient(1100px 620px at 78% -12%, rgba(70,40,100,.40) 0%, transparent 62%);
  --paper:#EDE6F2; --muted:#9C8AAE;
  --jade:#46D8A0; --amber:#FFB347; --coral:#FF5C6C;
  --display:"Oswald","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","Consolas",monospace;
}

[data-theme="light"]{
  color-scheme:light;
  --ink:#E7EBF3;
  --paper:#191322; --muted:#5C5270; --edge:#CBC5DA;
  --jade:#0B8A60; --amber:#A26000; --coral:#C92B41;
  --fill-1:rgba(255,255,255,.80);
  --fill-2:rgba(255,255,255,.87);
  --fill-3:rgba(247,245,251,.87);
  --toast-fill:rgba(255,255,255,.95);
  --field:rgba(255,255,255,.72);
  --track:rgba(0,0,0,.12);
  --hover:rgba(0,0,0,.055);
  --shadow:rgba(45,32,70,.20);
  --scrim:linear-gradient(180deg, rgba(236,240,248,.84) 0%, rgba(236,240,248,.89) 55%, rgba(236,240,248,.94) 100%);
  --glow:radial-gradient(1100px 620px at 78% -12%, rgba(150,120,200,.20) 0%, transparent 62%);
}
*{box-sizing:border-box}
/* 瀏覽器內建的 [hidden]{display:none} 優先權極低，
   任何 .class{display:...} 都會蓋掉它，導致 JS 設了 hidden 卻沒作用。
   統一在這裡補一條高優先權的規則。 */
[hidden]{display:none !important}
button,input,select,.onbox{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--paper); font-family:var(--body);
  background:var(--ink);
  /* 用了 viewport-fit=cover，內容必須自己避開瀏海與圓角。
     橫式時瀏海在左側或右側，靠 inset-left / inset-right 推開。 */
  padding-top:max(20px, env(safe-area-inset-top));
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  min-height:100vh;
  min-height:100dvh;                        /* 支援時優先用動態視窗高度 */
  min-height:calc(var(--vh) * 100);         /* JS 實測值，最準確 */
  overscroll-behavior-y:contain;  /* 擋掉下拉重新整理，捲清單不會誤觸 */
}

body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    var(--glow), var(--scrim);
}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.bicon{width:46px;height:46px;flex:0 0 auto;border-radius:11px;border:1px solid var(--edge);
  box-shadow:0 4px 16px var(--shadow);object-fit:cover;display:block}
@media (max-width:520px){.bicon{width:38px;height:38px;border-radius:9px}}
h1{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:.12em;margin:0;
  text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.75)}
h1 span{color:var(--muted);font-size:12px;letter-spacing:.2em;display:block;margin-top:3px}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.seg{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden;
  background:var(--fill-1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{border:0;border-radius:0;padding:5px 9px;line-height:0;color:var(--muted);
  border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
.seg button[data-theme-set="light"] svg circle{fill:currentColor;stroke:none}
.seg button[data-theme-set="dark"] svg path{fill:currentColor;stroke:none}
.seg button[aria-pressed="true"]{background:var(--jade);color:#0C1F18}
[data-theme="light"] .seg button[aria-pressed="true"]{color:#F4FBF8}

.hero{border:1px solid var(--edge);border-radius:14px;padding:22px 22px 18px;
  background:linear-gradient(180deg, var(--fill-2), var(--fill-3));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 32px var(--shadow);
  position:relative;overflow:hidden;margin-bottom:22px}
.hero .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.hero .name{font-family:var(--display);font-size:30px;letter-spacing:.06em;margin:6px 0 2px;line-height:1.15}
.hero .at{font-size:13px;color:var(--muted);font-family:var(--mono)}
.hero .big{font-family:var(--mono);font-size:clamp(44px,13vw,72px);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;margin:14px 0 4px}
.hero.state-far .big{color:var(--jade)}
.hero.state-soon .big{color:var(--amber)}
.hero.state-now .big{color:var(--coral)}
.hero .track{height:4px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:16px}
.herokill{position:absolute;top:16px;right:16px;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:11px 18px;min-height:52px;border-radius:10px;
  border:1px solid var(--coral);color:var(--coral);font-size:15px;font-weight:700;
  letter-spacing:.04em;background:transparent}
.herokill span{font-size:10px;font-weight:400;letter-spacing:.12em;opacity:.75}
.heroedit{position:absolute;top:16px;right:16px;z-index:2;padding:9px 14px;min-height:40px;
  border-radius:9px;font-size:13px;color:var(--muted);border:1px solid var(--edge);background:transparent}
.heroedit:hover{color:var(--paper);border-color:var(--muted)}
/* 兩顆同時出現時，校時讓到已擊殺左邊 */
.hero:has(.herokill:not([hidden])) .heroedit{right:auto;left:auto;
  transform:translateX(calc(-100% - 8px));right:16px;position:absolute}
.herokill:hover{background:var(--coral);color:#fff;border-color:var(--coral)}
.herokill:active{transform:scale(.97)}
.hero .name,.hero .at{padding-right:120px}
.hero .fill{height:100%;width:0;background:var(--jade);transition:width .4s linear}
.hero.state-soon .fill{background:var(--amber)}
.hero.state-now .fill{background:var(--coral)}
.hero.state-now::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--coral);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}

.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 8px}
.rowhead h2{font-family:var(--display);font-size:14px;letter-spacing:.2em;color:var(--muted);margin:0;text-transform:uppercase}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.col{min-width:0}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--muted);
  text-transform:uppercase;padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--edge)}
.colhead button{padding:4px 8px;font-size:12px}
ul.collist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.boss{border:1px solid var(--edge);border-left:3px solid var(--jade);border-radius:10px;
  background:var(--fill-1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:10px 12px;position:relative;overflow:hidden}
li.boss.state-soon{border-left-color:var(--amber)}
li.boss.state-now{border-left-color:var(--coral)}
li.boss .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--jade);opacity:.5;width:0;transition:width .4s linear}
li.boss.state-soon .bar{background:var(--amber)}
li.boss.state-now .bar{background:var(--coral)}
.idcell{display:flex;align-items:center;gap:10px}
.onbox{accent-color:var(--jade);width:18px;height:18px;flex:0 0 auto;cursor:pointer;margin:0}
li.boss.off{opacity:.45;border-left-color:var(--edge)}
li.boss.off .bcount{color:var(--muted)!important}
.line1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bname{font-family:var(--display);font-size:17px;letter-spacing:.03em;line-height:1.25;word-break:break-word}
.bloc{font-size:11px;color:var(--muted);margin-top:2px}
.bcount{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
li.boss.state-far .bcount{color:var(--jade)}
li.boss.state-soon .bcount{color:var(--amber)}
li.boss.state-now .bcount{color:var(--coral)}
.line2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.meta{font-size:11px;color:var(--muted);font-family:var(--mono);line-height:1.5}
.rtrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rtbig{font-family:var(--mono);font-size:26px;text-align:center;letter-spacing:.06em;
  padding:10px 8px;font-variant-numeric:tabular-nums}
.rtpreview{font-size:12px;font-family:var(--mono);color:var(--jade)}
.rtpreview.warn{color:var(--coral)}
.rtlabel{font-size:11px;color:var(--muted);width:100%}
input.rt{width:62px;text-align:center;font-family:var(--mono);padding:6px 4px}
.editrow{margin-top:10px;padding-top:10px;border-top:1px dashed var(--edge);display:flex;flex-direction:column;gap:8px}
.editrow input{font-family:var(--mono)}
.editacts{display:flex;gap:6px;flex-wrap:wrap}
.editacts button{padding:9px 16px;font-size:13px;min-height:40px}
.acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.acts button{padding:4px 9px;font-size:12px}

button,input,select{font-family:inherit;font-size:14px;color:var(--paper)}
button{background:transparent;border:1px solid var(--edge);border-radius:7px;padding:6px 11px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--hover);border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.kill{border-color:var(--coral);color:var(--coral)}
button.kill:hover{background:#FF5C6C1f}
button.ghost{color:var(--muted);border-color:transparent;padding:6px 8px}
button.primary{background:var(--jade);color:#0C1F18;border-color:var(--jade);font-weight:700}
button.primary:hover{background:#5EE8B0}
input,select{background:var(--field);border:1px solid var(--edge);border-radius:7px;padding:8px 10px;width:100%}
input::placeholder{color:#6F5F80}
.mini{width:70px;display:inline-block}

.card{border:1px solid var(--edge);border-radius:12px;padding:16px;margin-top:14px;
  background:var(--fill-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{padding:6px 10px;font-size:13px;min-width:38px}
.days button[aria-pressed="true"]{background:var(--jade);color:#0C1F18;border-color:var(--jade);font-weight:700}
.settings-head{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--paper)}
.settings + .settings{margin-top:12px;padding-top:12px;border-top:1px solid var(--edge)}
.settings input[type=checkbox]{accent-color:var(--jade);width:16px;height:16px;margin-right:2px;vertical-align:-2px}
.settings span{display:inline-flex;align-items:center;cursor:pointer}
.settings label{display:inline;letter-spacing:0;text-transform:none;font-size:14px;margin:0;cursor:pointer}
.empty{border:1px dashed var(--edge);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--tabbar-h) + env(safe-area-inset-bottom));
  z-index:30;transform:translateX(-50%);background:var(--toast-fill);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--edge);padding:10px 18px;border-radius:99px;
  font-size:13px;line-height:1.4;opacity:0;transition:opacity .25s;
  pointer-events:none;max-width:calc(100vw - 32px);text-align:center;
  box-shadow:0 6px 24px var(--shadow)}
.toast.show{opacity:1;pointer-events:auto;cursor:pointer}
/* 帶有動作按鈕時改成一列：訊息在左、按鈕在右，用圓角矩形而非膠囊 */
.toast.has-action{display:flex;align-items:center;gap:14px;
  padding:9px 9px 9px 18px;border-radius:14px;text-align:left}
.toast.has-action .msg{flex:1;min-width:0}
.toast .undo{flex:0 0 auto;padding:6px 14px;font-size:12px;border-radius:9px;
  border:1px solid var(--jade);color:var(--jade);min-height:34px;white-space:nowrap}
.toast .undo:hover{background:var(--jade);color:#0C1F18}
/* ── 再下一個：小卡（僅窄螢幕顯示）── */
.cards{display:none;flex-direction:column;gap:10px;margin:-10px 0 20px}
.upnext{border:1px solid var(--edge);border-left:3px solid var(--edge);border-radius:12px;
  padding:12px 14px;background:var(--fill-1);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.upnext.state-far{border-left-color:var(--jade)}
.upnext.state-soon{border-left-color:var(--amber)}
.upnext.state-now{border-left-color:var(--coral)}
.upnext.state-far .upcount{color:var(--jade)}
.upnext.state-soon .upcount{color:var(--amber)}
.upnext.state-now .upcount{color:var(--coral)}
.uplabel-same{color:var(--coral)}
.uplabel-lead{color:var(--amber)}
.uplabel{font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.uprow{display:flex;align-items:center;gap:11px}
.upmain{flex:1;min-width:0}
.upkill{flex:0 0 auto;padding:7px 13px;font-size:13px;min-height:38px}
.upnext .onbox{flex:0 0 auto}
.upmain{min-width:0}
.upname{font-family:var(--display);font-size:19px;letter-spacing:.04em;line-height:1.2}
.upat{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.upcount{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--muted)}

/* ── 底部分頁列（僅窄螢幕顯示）── */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;
  border-top:1px solid var(--edge);background:var(--toast-fill);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right)}
.tabbar button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;
  letter-spacing:.06em}
.tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6}
.tabbar button[aria-pressed="true"]{color:var(--jade)}
.tabbar button:hover{background:transparent}

/* ── 窄螢幕：拆成「倒數」與「設定」兩個檢視 ── */
/* 拆成兩個檢視的條件：
   - pointer:coarse  → 手指操作的裝置（手機、平板），不分方向一律拆
   - max-width:900px → 桌機把視窗拉窄時
   - max-height:600px→ 手機橫式這種矮視窗
   單用寬度判斷會漏掉大尺寸手機橫式（932px）與平板橫式。 */
@media (pointer:coarse), (max-width:900px), (max-height:600px){
  body{
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
  }
  /* Android 的觸控目標建議為 48dp，iOS 為 44pt，取大者 */
  .seg button{padding:11px 14px;min-height:48px}
  .seg button svg{width:19px;height:19px}
  .tabbar button{min-height:52px}
  :root{--tabbar-h:52px}
  .herokill{top:14px;right:14px;padding:12px 18px;min-height:56px;font-size:16px}
  .hero .name,.hero .at{padding-right:112px}
  .rtbig{font-size:30px;padding:13px 8px}
  .editacts{gap:8px}
  .editacts button{flex:1;min-height:46px}
  .acts button{min-height:38px;padding:7px 12px}
  .onbox{width:22px;height:22px}
  .cols{grid-template-columns:1fr;gap:14px}
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .tabbar{display:flex}
  .cards{display:flex}
  body[data-view="timer"] .sec-config{display:none}
  body[data-view="config"] .sec-timer{display:none}

  /* 倒數檢視留白多一點，讀起來更輕鬆 */
  body[data-view="timer"] .hero{padding:26px 22px 22px}
  body[data-view="timer"] .hero .name{font-size:27px}
  body[data-view="timer"] .hero .big{font-size:clamp(46px,16vw,74px)}

  .top{margin-bottom:16px}
  h1{font-size:21px}
  h1 span{font-size:10px}
}
@media (max-width:345px){
  /* 摺疊機收合後約 344px，舊機種 320px */
  .hero{padding:18px 16px 16px}
  .hero .name{font-size:22px}
  .herokill{padding:9px 12px;min-height:48px;font-size:14px}
  .hero .name,.hero .at{padding-right:88px}
  .top{gap:8px}
  .bicon{width:34px;height:34px}
}
@media (max-width:380px){
  .herokill{padding:10px 14px;min-height:50px;font-size:15px}
  .hero .name,.hero .at{padding-right:96px}
  .upcount{font-size:17px}
  .upname{font-size:17px}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
/* ── 倒數緊迫度：依絕對剩餘時間閃光 ──
   10 分內黃、5 分內橘、1 分內紅，越急促閃得越快。
   邊框顏色是靜態的，因此在「減少動態效果」的偏好下仍看得出級別。 */
@keyframes glowY{
  0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}
  50%    {box-shadow:0 0 20px 2px rgba(255,216,77,.38)}
}
@keyframes glowO{
  0%,100%{box-shadow:0 0 0 0 rgba(255,154,60,0)}
  50%    {box-shadow:0 0 24px 3px rgba(255,154,60,.46)}
}
@keyframes glowR{
  0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.05)}
  50%    {box-shadow:0 0 30px 5px rgba(255,77,94,.60)}
}
.hero.u10,.upnext.u10{border-color:rgba(255,216,77,.75);animation:glowY 1.9s ease-in-out infinite}
.hero.u5 ,.upnext.u5 {border-color:rgba(255,154,60,.85);animation:glowO 1.2s ease-in-out infinite}
.hero.u1 ,.upnext.u1 {border-color:rgba(255,77,94,.95); animation:glowR .68s ease-in-out infinite}
.upnext.u10{border-left-color:rgba(255,216,77,.95)}
.upnext.u5 {border-left-color:rgba(255,154,60,1)}
.upnext.u1 {border-left-color:rgba(255,77,94,1)}
/* 主卡片原本在「已重生」時有內框脈動，與閃光疊在一起會太吵 */
.hero.u1::after,.hero.u5::after,.hero.u10::after{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 已擊殺按鈕：依「卡片寬度」而非螢幕寬度縮放 ──
   固定 px 的問題是卡片會變寬（手機橫式、平板），按鈕卻不會跟著長，
   比例上就顯得小。用容器查詢單位 cqi（卡片寬度的 1%）即可自動貼合。
   上面的 px 規則保留為不支援時的後備。                            */
@supports (container-type: inline-size){
  .hero{container-type:inline-size}

  .herokill{
    top:clamp(14px, 2.2cqi, 22px);
    right:clamp(14px, 2.2cqi, 22px);
    min-height:clamp(52px, 9cqi, 72px);
    padding:clamp(10px, 1.6cqi, 15px) clamp(16px, 3cqi, 26px);
    font-size:clamp(15px, 2.3cqi, 20px);
    border-radius:clamp(10px, 1.4cqi, 14px);
  }
  .herokill span{font-size:clamp(10px, 1.35cqi, 13px)}

  /* 名稱與地點讓出的右側空間也要跟著長，長名稱才不會壓到按鈕 */
  .hero .name, .hero .at{padding-right:clamp(96px, 19cqi, 190px)}
}

/* ── 橫式矮視窗：改成橫向排列 ──
   寬而矮的形狀不該再由上往下堆內容，否則右側整片留白、卡片被撐高。
   主卡片內部改為格線：左邊名稱、中間倒數、右邊按鈕，進度條橫跨底部。 */
@media (orientation:landscape) and (max-height:600px){
  /* 橫式時瀏海位於左右兩側，這裡必須沿用 env()，
     否則固定留白會蓋掉安全區，內容就被瀏海切掉。 */
  body{
    padding-top:max(12px, env(safe-area-inset-top));
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .top{margin-bottom:10px}
  h1{font-size:19px}
  h1 span{display:none}
  .bicon{width:34px;height:34px}
  .clock{font-size:12px}

  body[data-view="timer"] .hero{
    margin-bottom:12px;
    padding:14px 18px 12px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    grid-template-areas:
      "eyebrow big kill"
      "name    big kill"
      "at      big kill"
      "track   track track";
    align-items:center;
    column-gap:16px;
  }
  body[data-view="timer"] .hero .eyebrow{grid-area:eyebrow;align-self:end}
  body[data-view="timer"] .hero .name{grid-area:name;padding-right:0;font-size:clamp(19px, calc(var(--vh) * 5), 28px)}
  body[data-view="timer"] .hero .at{grid-area:at;padding-right:0;align-self:start}
  body[data-view="timer"] .hero .big{
    grid-area:big;margin:0;justify-self:end;
    font-size:clamp(32px, calc(var(--vh) * 10), 58px);
  }
  body[data-view="timer"] .hero .track{grid-area:track;margin-top:12px}
  body[data-view="timer"] .herokill{
    grid-area:kill;position:static;
    align-self:center;justify-self:end;
    min-height:clamp(46px, calc(var(--vh) * 12.5), 62px);
    font-size:clamp(14px, calc(var(--vh) * 3.5), 18px);
    padding:8px 16px;
  }

  body[data-view="timer"] .upnext{
    margin:0;
    padding:12px 16px;
  }
  .upname{font-size:clamp(17px, calc(var(--vh) * 4.4), 23px)}
  .upcount{font-size:clamp(16px, calc(var(--vh) * 4.2), 23px)}

  .tabbar button{padding:6px 0 5px;font-size:10px;min-height:46px}
  :root{--tabbar-h:46px}
  .tabbar button svg{width:18px;height:18px}
}

/* 更矮的視窗（一般手機橫式約 390px 高）再壓一級 */
@media (orientation:landscape) and (max-height:440px){
  body{
    padding-top:max(8px, env(safe-area-inset-top));
    padding-left:max(12px, env(safe-area-inset-left));
    padding-right:max(12px, env(safe-area-inset-right));
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  .top{margin-bottom:6px}
  h1{font-size:17px}
  body[data-view="timer"] .hero{padding:10px 14px 9px}
  body[data-view="timer"] .hero .track{margin-top:8px}
  body[data-view="timer"] .upnext{padding:10px 14px}
  .eyebrow,.uplabel{font-size:9px;letter-spacing:.18em}
  .tabbar button{min-height:42px;padding:4px 0 3px}
  :root{--tabbar-h:42px}
}
</style>

<body>
<div class="wrap">

<script>
const KEY = 'aion2AbyssTimer:v1';
const DAYS = ['日','一','二','三','四','五','六'];
let state = { bosses: [], sound: true, notify: false, leads: [10, 5, 0], volChime: 1, volAlarm: 1, theme: 'system', view: 'timer' };
let pickedDays = [6, 0];

/* ---------- 儲存 ----------
   優先用 Claude 畫布提供的 window.storage；
   直接用瀏覽器開檔（file://）時它不存在，就退回 localStorage；
   兩者都不能用才只留在記憶體。                                  */
let storeMode = 'none';
const store = {
  async get(k){
    if(window.storage){
      try{ const r = await window.storage.get(k); storeMode = 'canvas'; return r; }
      catch(e){ storeMode = 'canvas'; return null; }   // 沒有這筆資料也算可用
    }
    try{
      const v = localStorage.getItem(k);
      storeMode = 'local';
      return v == null ? null : { key:k, value:v };
    }catch(e){ storeMode = 'none'; return null; }
  },
  async set(k, v){
    if(storeMode === 'canvas'){ await window.storage.set(k, v); return true; }
    if(storeMode === 'local'){ localStorage.setItem(k, v); return true; }
    return false;
  }
};

let warnedOnce = false;
async function load(){
  try{
    const r = await store.get(KEY);
    if(r && r.value) state = Object.assign(state, JSON.parse(r.value));
  }catch(e){ storeMode = 'none'; }
  const EVENT_NAMES = ['神器戰爭','深淵裂縫地帶','深淵裂縫戰爭','樹古慶典','次元進攻','次元裂縫','天魔裂縫'];
  for(const b of state.bosses){
    if(b.name === '次元裂縫') b.name = '次元進攻';        // 舊存檔自動改名
    if(b.name === '深淵裂縫戰爭') b.name = '深淵裂縫地帶';
    if(b.name === '精靈王阿格羅' && b.intervalMs === 24*3600*1000){
      // 週期改為 12 小時。反推 lastKill 讓下次重生時刻不變，切換當下不會跳動。
      const next = b.lastKill + b.intervalMs;
      b.intervalMs = 12*3600*1000;
      b.lastKill = next - b.intervalMs;
      b.fired = []; b.firedFor = null;
    }
    if(!b.cat) b.cat = EVENT_NAMES.includes(b.name) ? 'event' : 'boss';
    if(b.name === '監視者卡伊拉' && b.mode !== 'hourly'){
      // 還原為固定每整點。方向只有這一條，避免與其他規則互相抵銷。
      b.mode = 'hourly';
      b.minute = 0;
      delete b.intervalMs; delete b.lastKill;
      b.fired = []; b.firedFor = null;
    }
    if(b.name === '守護神將納赫瑪' && b.mode === 'weekly'
       && String(b.days) === '6,0' && String(b.times) === '21:00'){
      b.days = [5,0]; b.times = ['22:00']; b.fired = []; b.firedFor = null;
    }
  }
  if(!Array.isArray(state.leads)) state.leads = [10, 5, 0];
  delete state.lead;
  document.getElementById('optSound').checked = state.sound;
  document.getElementById('optNotify').checked = state.notify;
  document.getElementById('lead10').checked = state.leads.includes(10);
  document.getElementById('lead5').checked  = state.leads.includes(5);
  document.getElementById('lead0').checked  = state.leads.includes(0);
  if(state.vol && state.volChime == null){          // 舊版單一音量 → 拆成兩組
    state.volChime = state.volAlarm = state.vol;
  }
  delete state.vol;
  for(const [id, lab, key] of [['optVolChime','volChimeLabel','volChime'],
                               ['optVolAlarm','volAlarmLabel','volAlarm']]){
    const pct = Math.round((state[key] ?? 1) * 100);
    document.getElementById(id).value = pct;
    document.getElementById(lab).textContent = pct + '%';
  }
  applyTheme(); applyView();
  render(); tick(); showStoreNote(); showNotifyNote();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const ok = await store.set(KEY, JSON.stringify(state));
      if(!ok) throw new Error('no storage');
    }catch(e){
      storeMode = 'none';
      if(!warnedOnce){
        warnedOnce = true;
        toast('這個瀏覽器不允許存檔，清單只保留到關閉分頁為止');
      }
    }
  }, 300);
}

/* ---------- 時間計算 ---------- */
function nextSpawn(b){
  const now = Date.now();
  if(b.mode === 'interval') return b.lastKill + b.intervalMs;
  if(b.mode === 'hourly'){
    const d = new Date();
    d.setMinutes(b.minute, 0, 0);
    if(d.getTime() <= now) d.setHours(d.getHours() + 1);
    return d.getTime();
  }
  const span = b.mode === 'weekly' ? 8 : 2;
  let best = Infinity;
  for(const t of b.times){
    const [h,m] = t.split(':').map(Number);
    for(let off = 0; off < span; off++){
      const d = new Date();
      d.setHours(h, m, 0, 0);
      d.setDate(d.getDate() + off);
      if(b.mode === 'weekly' && !b.days.includes(d.getDay())) continue;
      if(d.getTime() > now) best = Math.min(best, d.getTime());
    }
  }
  return best;
}
function cycleMs(b){
  if(b.mode === 'interval') return b.intervalMs;
  if(b.mode === 'hourly') return 3600*1000;
  if(b.mode === 'weekly') return 7*86400*1000;
  return 86400*1000 / Math.max(1, b.times.length);   // 每日多場時依實際間隔
}
function fmt(ms){
  const over = ms < 0;
  let s = Math.floor(Math.abs(ms)/1000);
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600);  s -= h*3600;
  const m = Math.floor(s/60);    s -= m*60;
  const p = n => String(n).padStart(2,'0');
  const core = d > 0 ? `${d}天 ${p(h)}:${p(m)}:${p(s)}` : `${p(h)}:${p(m)}:${p(s)}`;
  return over ? '+' + core : core;
}
function clockOf(ts){
  if(!isFinite(ts)) return '—';
  const d = new Date(ts), n = new Date();
  const p = x => String(x).padStart(2,'0');
  const dayDiff = Math.round((new Date(d).setHours(0,0,0,0) - new Date(n).setHours(0,0,0,0)) / 86400000);
  const prefix = dayDiff === 0 ? '' : dayDiff === 1 ? '明天 ' : `週${DAYS[d.getDay()]} `;
  return prefix + p(d.getHours()) + ':' + p(d.getMinutes());
}
// 可校時的模式：擊殺後計時，以及每整點（實際重生常有偏移）
function canEdit(b){ return b.mode === 'interval' || b.mode === 'hourly'; }
function rtLen(b){
  if(b.mode === 'hourly') return 4;                    // 週期一小時，分:秒 足夠
  return b.intervalMs > 3600*1000 ? 6 : 4;
}
function editCycle(b){ return b.mode === 'hourly' ? 3600*1000 : b.intervalMs; }
function fmtRt(digits, len){
  const d = String(digits).replace(/\D/g, '').slice(-len).padStart(len, '0');
  return len === 6
    ? d.slice(0,2) + ':' + d.slice(2,4) + ':' + d.slice(4,6)
    : d.slice(0,2) + ':' + d.slice(2,4);
}
function rtToSeconds(value, len){
  const d = String(value).replace(/\D/g, '').slice(-len).padStart(len, '0');
  return len === 6
    ? (+d.slice(0,2))*3600 + (+d.slice(2,4))*60 + (+d.slice(4,6))
    : (+d.slice(0,2))*60 + (+d.slice(2,4));
}
function secondsToRt(sec, len){
  sec = Math.max(0, Math.floor(sec));
  if(len === 6){
    const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s2 = sec%60;
    return fmtRt(String(h).padStart(2,'0') + String(m).padStart(2,'0') + String(s2).padStart(2,'0'), 6);
  }
  const m = Math.floor(sec/60), s2 = sec%60;
  return fmtRt(String(m).padStart(2,'0') + String(s2).padStart(2,'0'), 4);
}
function cycleText(ms){
  const m = Math.round((typeof ms === 'object' ? ms.intervalMs : ms) / 60000);
  if(m % 60 === 0) return (m / 60) + ' 小時';
  if(m > 60) return Math.floor(m/60) + ' 小時 ' + (m % 60) + ' 分';
  return m + ' 分';
}
function ruleText(b){
  if(b.mode === 'interval'){
    const mins = Math.round(b.intervalMs/60000);
    return mins % 60 === 0 ? `間隔 ${mins/60} 小時` : `間隔 ${mins} 分`;
  }
  if(b.mode === 'hourly') return b.minute === 0 ? '每整點' : `每小時 ${String(b.minute).padStart(2,'0')} 分`;
  if(b.mode === 'weekly') return '每週 ' + b.days.map(d=>DAYS[d]).join('、') + ' ' + b.times.join(' / ');
  return '每日 ' + b.times.join(' / ');
}
function leadText(b, ns){
  if(!Array.isArray(b.leads) || !b.leads.length || !isFinite(ns)) return '';
  const p = x => String(x).padStart(2,'0');
  const times = b.leads.filter(l => l > 0).sort((a,c)=>c-a).map(l=>{
    const d = new Date(ns - l*60000);
    return p(d.getHours()) + ':' + p(d.getMinutes());
  });
  return times.length ? ' · 提醒 ' + times.join(' / ') : '';
}
function effectiveLeads(b){
  return (Array.isArray(b.leads) && b.leads.length) ? b.leads : state.leads;
}
// 剩餘時間的緊迫等級，與提醒設定無關，純粹看還剩多久
function urgency(left){
  if(left < 60*1000)     return ' u1';    // 一分鐘內：紅
  if(left < 5*60*1000)   return ' u5';    // 五分鐘內：橘
  if(left < 10*60*1000)  return ' u10';   // 十分鐘內：黃
  return '';
}
function stateOf(b, left){
  if(left <= 0) return 'now';
  if(left <= (Math.max(0, ...effectiveLeads(b)) || 5)*60*1000) return 'soon';
  return 'far';
}

/* ---------- 畫面 ---------- */
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  document.getElementById('empty').hidden = state.bosses.length > 0;

  // 已經在倒數頁的項目不重複列出；取消勾選或按「已擊殺」後就會回到這裡
  for(const [cat, title] of CATS){
    const group = state.bosses.filter(b => (b.cat || 'boss') === cat && (!onTimer.has(b.id) || b.id === editingId))
                              .sort((a,b)=> nextSpawn(a) - nextSpawn(b));
    if(!group.length) continue;

    const col = document.createElement('div');
    col.className = 'col';

    const head = document.createElement('div');
    head.className = 'colhead';
    head.innerHTML = `<span></span><button class="ghost" data-group="${cat}">全部切換</button>`;
    head.querySelector('span').textContent = `${title}（${group.length}）`;
    col.appendChild(head);

    const ul = document.createElement('ul');
    ul.className = 'collist';
    col.appendChild(ul);

    for(const b of group){
      const li = document.createElement('li');
      li.className = 'boss';
      li.dataset.id = b.id;
      li.innerHTML = `
        <div class="line1">
          <div class="idcell">
            <input type="checkbox" class="onbox" ${b.on === false ? '' : 'checked'}
                   title="勾選才會提醒" aria-label="開啟 ${b.name} 的提醒">
            <div>
              <div class="bname"></div>
              <div class="bloc"></div>
            </div>
          </div>
          <div class="bcount" data-count>--:--:--</div>
        </div>
        <div class="line2">
          <div class="meta" data-meta></div>
          <div class="acts">
            ${b.mode==='interval' ? '<button class="kill" data-act="kill">已擊殺</button><button data-act="back">往前 5 分</button>' : ''}
            ${canEdit(b) ? '<button data-act="edit">校時</button>' : ''}
            <button class="ghost" data-act="del">刪除</button>
          </div>
        </div>
        ${canEdit(b) ? `

          <div class="rtlabel">距離下次重生還有${b.mode==='interval' ? `（週期 ${cycleText(b)}）` : ''}</div>
          <input class="rtbig" data-rt type="text" inputmode="numeric"
                 aria-label="剩餘時間" placeholder="${rtLen(b) === 6 ? '00:00:00' : '00:00'}">
          <div class="rtpreview" data-preview></div>
          <div class="editacts">
            <button class="primary" data-act="applyRemain">套用</button>
            <button data-act="closeEdit">取消</button>

        </div>` : ''}

      li.querySelector('.bloc').textContent = b.loc || '';
      ul.appendChild(li);
    }
    list.appendChild(col);
  }
}

const LABELS = { same:'同時', next:'再下一個', soon:'一小時內', lead:'即將提醒' };
let cardsSig = '';
let editingId = null;          // 正在校時的項目，暫時不放進倒數頁
let heroId = null;             // 主卡片的項目
let onTimer = new Set();       // 目前顯示在倒數頁的項目 id
let onTimerSig = '';

/* 讓設定頁跟上倒數頁的組成。
   關鍵：onTimer 由 tick 算出的結果直接推導，render() 只負責讀取。
   先前讓 renderCards 去改 onTimer 再回頭呼叫 render()，
   造成 tick → render → 排序改變 → tick 的循環相依，畫面就來回跳動。 */
function syncPages(cards){
  const ids = cards.map(c => c.x.b.id).filter(id => id !== editingId);
  if(heroId && heroId !== editingId) ids.push(heroId);
  const sig = ids.slice().sort().join(',');
  if(sig === onTimerSig) return;      // 沒變就不重繪，這是止住迴圈的關鍵
  onTimerSig = sig;
  onTimer = new Set(ids);
  render();
}
function renderCards(cards){
  const wrap = document.getElementById('cards');
  const sig = (heroId || '-') + '#' + cards.map(c => c.kind + ':' + c.x.b.id).join('|');
  if(sig !== cardsSig){
    cardsSig = sig;
    wrap.innerHTML = '';
    for(const c of cards){
      const el = document.createElement('div');
      el.className = 'upnext';
      el.dataset.id = c.x.b.id;
      el.innerHTML = `
        <div class="uplabel uplabel-${c.kind}"></div>
        <div class="uprow">
          <input type="checkbox" class="onbox" checked
                 aria-label="關閉 ${c.x.b.name} 的提醒">
          <div class="upmain">
            <div class="upname"></div>
            <div class="upat"></div>
          </div>
          ${c.x.b.mode === 'interval'
            ? '<button class="kill upkill" data-act="kill">已擊殺</button>' : ''}
          ${canEdit(c.x.b) ? '<button class="upkill" data-act="goedit">校時</button>' : ''}
          <div class="upcount">--:--:--</div>
        </div>`;
      el.querySelector('.uplabel').textContent = LABELS[c.kind];
      el.querySelector('.upname').textContent = c.x.b.name;
      wrap.appendChild(el);
    }
  }
  // 每秒更新的部分
  cards.forEach((c, i) => {
    const el = wrap.children[i];
    if(!el) return;
    el.className = 'upnext state-' + c.x.st + urgency(c.x.left);
    el.querySelector('.upcount').textContent = fmt(c.x.left);
    const b = c.x.b;
    let at = (b.loc ? b.loc + ' · ' : '') + clockOf(c.x.ns);
    if(c.kind === 'lead'){
      const t = leadText(b, c.x.ns).replace(' · ', '');
      if(t) at += '　' + t.trim();
    }
    el.querySelector('.upat').textContent = at;
  });
}

function tick(){
  const now = Date.now();
  const p = n => String(n).padStart(2,'0');
  const nd = new Date();
  document.getElementById('clock').textContent =
    `週${DAYS[nd.getDay()]} ${p(nd.getHours())}:${p(nd.getMinutes())}:${p(nd.getSeconds())}`;

  let head = null;
  const active = [];
  const due = [];
  // 一律走訪 state.bosses，不是走訪 DOM。
  // 先前從 li.boss 反查，項目被設定頁過濾掉後就從計算中消失，
  // 導致主卡片在兩個項目間來回跳動。DOM 更新只是附帶動作。
  for(const b of state.bosses){
    const ns = nextSpawn(b);
    const left = ns - now;
    const st = stateOf(b, left);

    const li = document.querySelector(`li.boss[data-id="${b.id}"]`);
    if(li){
      li.className = 'boss state-' + st + (b.on === false ? ' off' : '');
      li.querySelector('[data-count]').textContent = isFinite(ns) ? fmt(left) : '—';
      li.querySelector('[data-meta]').textContent =
        (left <= 0
          ? (b.cat === 'event' ? '已開始 · ' : '已重生 · ')
          : (b.cat === 'event' ? '開始於 ' : '重生於 ') + clockOf(ns) + ' · ')
        + ruleText(b) + leadText(b, ns);
      const prog = Math.max(0, Math.min(1, 1 - left / cycleMs(b)));
      li.querySelector('[data-bar]').style.width = (prog*100) + '%';
    }

    if(b.on === false) continue;              // 沒勾選就只顯示倒數，不提醒
    const hit = alertCheck(b, ns, left);
    if(hit) due.push(hit);
    if(isFinite(ns)){
      active.push({ b, ns, left, st });
      if(!head || ns < head.ns) head = { b, ns, left, st };
    }
  }
  fireBatch(due);

  active.sort((a, b2) => a.ns - b2.ns);

  // 倒數頁一律只收「一小時內」的項目，超過就留在設定頁。
  //   同時    —— 與主卡片同一時刻（整點常常撞在一起）
  //   再下一個 —— 第一個時刻更晚的項目，同樣受一小時上限約束
  //   一小時內 —— 其餘一小時內的項目
  //   即將提醒 —— 有獨立提醒設定者，第一則提醒將在一小時內發生
  const HORIZON = 3600*1000;
  const cards = [];
  if(head){
    const seen = new Set([head.b.id]);
    const add = (kind, x) => { if(!seen.has(x.b.id)){ seen.add(x.b.id); cards.push({ kind, x }); } };

    active.forEach(x => { if(x.ns === head.ns) add('same', x); });
    const second = active.find(x => x.ns > head.ns && x.left < HORIZON);
    if(second) add('next', second);
    active.forEach(x => { if(x.left < HORIZON) add('soon', x); });
    active.forEach(x => {
      if(!Array.isArray(x.b.leads) || !x.b.leads.length) return;
      // 提醒本身要在一小時內響，才把它擺上來
      const maxLead = Math.max(...x.b.leads) * 60000;
      const untilFirstAlert = x.left - maxLead;
      if(untilFirstAlert >= 0 && untilFirstAlert < HORIZON) add('lead', x);
    });
    cards.sort((a, b2) => a.x.ns - b2.x.ns);
  }
  heroId = head ? head.b.id : null;
  renderCards(cards);
  syncPages(cards);

  const hero = document.getElementById('hero');
  if(head){
    hero.className = 'hero sec-timer state-' + head.st + urgency(head.left);
    document.getElementById('heroName').textContent = head.b.name;
    document.getElementById('heroAt').textContent =
      head.left <= 0
        ? (head.b.cat === 'event' ? '已經開始了' : '已經重生，快去')
        : (head.b.loc ? head.b.loc + ' · ' : '') + clockOf(head.ns);
    document.getElementById('heroCount').textContent = fmt(head.left);
    const kb = document.getElementById('heroKill');
    kb.hidden = head.b.mode !== 'interval';      // 固定排程的活動沒有擊殺的概念
    kb.dataset.id = head.b.id;
    const eb = document.getElementById('heroEdit');
    eb.hidden = !canEdit(head.b);
    eb.dataset.id = head.b.id;
    document.getElementById('heroFill').style.width =
      (Math.max(0, Math.min(1, 1 - head.left / cycleMs(head.b)))*100) + '%';
  }else{
    hero.className = 'hero sec-timer state-far';
    document.getElementById('heroName').textContent =
      state.bosses.length ? '沒有勾選任何提醒' : '目前沒有追蹤中的 BOSS';
    document.getElementById('heroAt').textContent =
      state.bosses.length ? '勾選清單左邊的方框，就會在這裡倒數' : '載入預設行程或自己新增一項';
    document.getElementById('heroCount').textContent = '--:--:--';
    document.getElementById('heroFill').style.width = '0%';
    document.getElementById('heroKill').hidden = true;
    document.getElementById('heroEdit').hidden = true;
  }
}

/* ---------- 提醒 ---------- */
// 回傳這次該提醒的內容（沒有就回 null），實際發聲交給 tick 統一處理
function alertCheck(b, ns, left){
  if(!isFinite(ns)) return null;
  if(b.firedFor !== ns){ b.firedFor = ns; b.fired = []; }
  const leads = effectiveLeads(b);
  // lead 0 = 最後警報，改在重生／開戰前 10 秒響
  const hit = leads
    .filter(l => l > 0 ? (left <= l*60*1000 && left > FINAL_MS) : left <= FINAL_MS)
    .sort((a,b2) => a - b2);
  if(!hit.length) return null;
  const announce = hit[0];
  let spoke = false;
  for(const lead of hit){
    if(b.fired.includes(lead)) continue;
    b.fired.push(lead);
    if(lead === announce) spoke = true;
  }
  if(!spoke) return null;

  const nearest = Math.min(...leads.filter(l => l > 0), Infinity);
  const kind = announce === 0 ? 'alarm' : announce === nearest ? 'urgent' : 'soft';
  const verb = b.cat === 'event' ? (/戰爭/.test(b.name) ? '開戰' : '開始') : '重生';
  return { name: b.name, announce, kind, verb, imminent: left > 0 };
}

// 同一秒有多項同時觸發時，合併成一則
const RANK = { soft:1, urgent:2, alarm:3 };
const FINAL_MS = 10000;                       // 最後警報：提前 10 秒
function fireBatch(items){
  if(!items.length) return;
  const kind = items.reduce((a, x) => RANK[x.kind] > RANK[a] ? x.kind : a, 'soft');
  const last = it => it.imminent ? `10 秒後${it.verb}` : `${it.verb}了`;
  let msg;
  if(items.length === 1){
    const it = items[0];
    msg = it.announce > 0 ? `${it.name} 還有 ${it.announce} 分鐘${it.verb}` : `${it.name} ${last(it)}`;
  }else{
    const names = items.map(i => i.name).join('、');
    const sameLead = items.every(i => i.announce === items[0].announce);
    msg = !sameLead
      ? items.map(i => i.announce > 0 ? `${i.name} 剩 ${i.announce} 分` : `${i.name} 要到了`).join('、')
      : items[0].announce > 0
        ? `${names} 都還有 ${items[0].announce} 分鐘`
        : `${names} ${items.every(i => i.imminent) ? '都剩 10 秒' : '都到了'}`;
  }
  fire(msg, kind);
}
/* ---------- 防止背景分頁被降頻 ----------
   Chrome/Edge 會把隱藏分頁的 setInterval 壓到最慢一分鐘一次，
   切到遊戲全螢幕後倒數就會失準。但「正在播放音訊」的分頁不受此限，
   所以掛一個振幅近乎於零的振盪器讓分頁保持活躍（聽不見）。      */
let keepAlive = null;
function startKeepAlive(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(keepAlive) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 40;
    g.gain.value = 0.0001;                 // −80dB，實質無聲
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    keepAlive = o;                         // 不放進 playing，才不會被 stopSound 關掉
  }catch(e){}
}
document.addEventListener('click', startKeepAlive);
document.addEventListener('keydown', startKeepAlive);

/* ---------- 桌面通知 ----------
   常見失效原因：
   1. 用 file:// 直接開檔 —— Chrome 不允許非安全來源發通知
   2. 頁面被包在 iframe 裡（例如畫布預覽）—— 權限政策擋掉
   3. 使用者或作業系統層級拒絕過權限
   4. Windows 的專注輔助／macOS 的專注模式把通知吞掉                */
function notifyStatus(){
  if(!('Notification' in window)) return { ok:false, why:'這個瀏覽器不支援桌面通知' };
  if(location.protocol === 'file:')
    return { ok:false, why:'用 file:// 開啟時瀏覽器不給通知權限' };
  if(window.self !== window.top)
    return { ok:false, why:'頁面被嵌在框架內，通知被權限政策擋住' };
  if(Notification.permission === 'denied')
    return { ok:false, why:'權限被拒絕過，需到網站設定重新允許' };
  if(Notification.permission === 'default')
    return { ok:false, why:'尚未授權，勾選「桌面通知」即可請求' };
  return { ok:true, why:'桌面通知可用' };
}
function showNotifyNote(){
  const st = notifyStatus();
  const el = document.getElementById('notifyNote');
  el.textContent = st.why;
  el.style.color = st.ok ? 'var(--jade)' : 'var(--muted)';
}
function notify(msg){
  const st = notifyStatus();
  if(!st.ok) return false;
  try{
    new Notification('永恆紀元2計時器', { body: msg, tag: 'aion2-timer', renotify: true });
    return true;
  }catch(e){ return false; }
}

/* ---------- 分頁標題閃爍（不需要任何權限，切到遊戲也看得到）---------- */
const BASE_TITLE = document.title;
let flashTimer = null, flashCount = 0;
function flashTitle(msg){
  clearInterval(flashTimer);
  flashCount = 0;
  flashTimer = setInterval(()=>{
    document.title = (flashCount % 2 === 0) ? '🔔 ' + msg : BASE_TITLE;
    if(++flashCount > 40){ clearInterval(flashTimer); document.title = BASE_TITLE; }
  }, 700);
}
function stopFlash(){ clearInterval(flashTimer); document.title = BASE_TITLE; }

function fire(msg, kind){
  toast(msg + ' · 按 Esc 或點一下停止音效');
  if(state.sound) beep(kind);
  if(state.notify) notify(msg);
  flashTitle(msg);
}

/* ---------- 音效 ----------
   設計方向：管風琴音栓 × 空襲警報
   - 音色全部用正弦波疊出泛音列（基音／八度／十二度／超八度／混合音栓），
     亮度來自高次泛音而不是方波鋸齒波的削波，所以聽起來亮但不刮耳
   - 辨識度來自緩慢的滑音，這是空襲警報的核心特徵
   - 輸出經過一段合成的教堂殘響，讓聲音有空間感、尾巴收得漂亮       */
let audioCtx = null;
let playing = [];
let busIn = null, masterGain = null;
let chimeIn = null, alarmIn = null, activeBus = null;

function stopSound(){
  playing.forEach(o => { try{ o.stop(); }catch(e){} });
  playing = [];
}

// 用衰減噪音合成脈衝響應，當作教堂殘響
function makeIR(seconds, decay){
  const rate = audioCtx.sampleRate, len = Math.floor(rate * seconds);
  const buf = audioCtx.createBuffer(2, len, rate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    for(let i = 0; i < len; i++){
      d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, decay);
    }
  }
  return buf;
}

function audio(){
  if(busIn) return busIn;
  busIn = audioCtx.createGain();

  const lp = audioCtx.createBiquadFilter();          // 只削掉真正尖銳的超高頻
  lp.type = 'lowpass'; lp.frequency.value = 11000; lp.Q.value = 0.4;

  const comp = audioCtx.createDynamicsCompressor();  // 疊很多層也不會爆
  comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 6;
  comp.attack.value = 0.006; comp.release.value = 0.3;

  const conv = audioCtx.createConvolver();
  conv.buffer = makeIR(1.7, 2.8);                    // 尾巴短一點，音符之間才留得住縫隙
  const wet = audioCtx.createGain(); wet.gain.value = 0.22;
  const dry = audioCtx.createGain(); dry.gain.value = 0.92;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.9;

  // 兩條獨立的音量匯流排：水晶杯提示音走 chimeIn，最後警報走 alarmIn
  chimeIn = audioCtx.createGain(); chimeIn.gain.value = state.volChime ?? 1;
  alarmIn = audioCtx.createGain(); alarmIn.gain.value = state.volAlarm ?? 1;
  chimeIn.connect(busIn); alarmIn.connect(busIn);

  busIn.connect(lp);
  lp.connect(dry);  dry.connect(comp);
  lp.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(masterGain); masterGain.connect(audioCtx.destination);
  return busIn;
}
// 目前這一次播放要走哪一條匯流排
function out(){ return activeBus || chimeIn || busIn; }

// 音栓配置：[泛音倍率, 音量比]。含第 3、5 泛音（十二度與大三度），
// 這是管風琴混合音栓聽起來「金亮」的來源
const STOPS = [[1,1.0],[2,0.55],[3,0.30],[4,0.24],[5,0.11],[6,0.13],[8,0.08]];
const STOPS_LIGHT = [[1,1.0],[2,0.52],[3,0.28],[4,0.20]];   // 快速音符用，省振盪器
const STOPS_MIN   = [[1,1.0],[2,0.45]];                     // 內聲部用，最省

function organ(t0, dur, f0, opt){
  const { peak=0.2, glideTo=null, attack=0.08, release=0.25, detune=6,
          light=false, min=false } = opt || {};
  const rel = Math.min(release, dur*0.45);
  const atk = Math.min(attack, dur*0.45);
  for(const [ratio, amp] of (min ? STOPS_MIN : light ? STOPS_LIGHT : STOPS)){
    // 低音層多疊一個微離調的振盪器，模仿顫音栓的厚度
    for(const cents of ((ratio <= 2 && detune) ? [0, detune] : [0])){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.detune.value = cents;
      o.frequency.setValueAtTime(f0*ratio, t0);
      if(glideTo) o.frequency.linearRampToValueAtTime(glideTo*ratio, t0 + dur);
      const p = Math.max(0.0002, peak * amp * (cents ? 0.55 : 1));
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(p, t0 + atk);
      g.gain.setValueAtTime(p, t0 + dur - rel);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(out());
      o.start(t0); o.stop(t0 + dur + 0.03);
      playing.push(o);
    }
  }
}

// 水晶杯敲擊：玻璃的清脆來自「非諧和」泛音——泛音不是整數倍，
// 而是 2.76、5.40、8.93 這種比例，加上極快的起音與長衰減
const GLASS = [[1,1.0,1.00],[2.76,0.34,0.55],[5.40,0.15,0.32],[8.93,0.07,0.20]];
function glass(t0, f0, peak){
  for(const [ratio, amp, decay] of GLASS){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f0 * ratio;
    const p = Math.max(0.0002, peak * amp);
    const dur = 1.6 * decay;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(p, t0 + 0.002);      // 幾乎瞬間起音＝敲擊感
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(out());
    o.start(t0); o.stop(t0 + dur + 0.03);
    playing.push(o);
  }
}


/* ── 噪音來源：鼓皮敲擊、上升音效都靠它 ── */
let _noiseBuf = null;
function noiseBuffer(){
  if(_noiseBuf) return _noiseBuf;
  const len = audioCtx.sampleRate * 2;
  _noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = _noiseBuf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  return _noiseBuf;
}
function noise(t0, dur, opt){
  const { peak=0.1, type='bandpass', freq=2000, freqEnd=null, q=0.8, attack=0.005 } = opt || {};
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(); src.loop = true;
  const f = audioCtx.createBiquadFilter();
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t0);
  if(freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(out());
  src.start(t0); src.stop(t0 + dur + 0.02);
  playing.push(src);
}

/* ── 太鼓：音高瞬間下墜的正弦波 + 一記噪音當鼓皮 ── */
function drum(t0, f0, peak, decay){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0 * 3.0, t0);
  o.frequency.exponentialRampToValueAtTime(f0, t0 + 0.055);
  g.gain.setValueAtTime(Math.max(0.0002, peak), t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
  o.connect(g); g.connect(out());
  o.start(t0); o.stop(t0 + decay + 0.02);
  playing.push(o);
  noise(t0, 0.045, { peak: peak*0.30, type:'bandpass', freq:1500, q:1.1 });
}

/* ── 銅管：鋸齒波 + 開啟的濾波器包絡，「咬」就是濾波器打開的瞬間 ── */
function brass(t0, dur, f, peak){
  for(const det of [-8, 8]){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const lp = audioCtx.createBiquadFilter();
    o.type = 'sawtooth'; o.detune.value = det; o.frequency.value = f;
    lp.type = 'lowpass'; lp.Q.value = 1.1;
    lp.frequency.setValueAtTime(f*1.4, t0);
    lp.frequency.linearRampToValueAtTime(Math.min(8000, f*8), t0 + 0.075);
    lp.frequency.linearRampToValueAtTime(Math.min(5000, f*4), t0 + dur);
    const p = Math.max(0.0002, peak*0.5);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(p, t0 + 0.028);
    g.gain.setValueAtTime(p, t0 + dur*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(out());
    o.start(t0); o.stop(t0 + dur + 0.03);
    playing.push(o);
  }
}

/* ── 弦樂碎弓：短促鋸齒波，靠密集重複製造摩擦感 ── */
function strings(t0, dur, f, peak){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.value = f;
  lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 0.7;
  const p = Math.max(0.0002, peak);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(p, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(lp); lp.connect(g); g.connect(out());
  o.start(t0); o.stop(t0 + dur + 0.02);
  playing.push(o);
}

/* ── 次低頻下墜：衝擊瞬間胸口那一下 ── */
function subDrop(t0, f0, f1, dur, peak){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(f1, t0 + dur*0.6);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(out());
  o.start(t0); o.stop(t0 + dur + 0.02);
  playing.push(o);
}

// 10 分：水晶杯三連敲，重複三組
// 5 分：水晶杯五連敲，重複五組
// 最後警報：原創的哥德式管風琴動機，低音踏板 + 漸強上行，時間到收和弦
function beep(kind, opt){
  const preview = opt && opt.preview;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audio();
    activeBus = (kind === 'alarm') ? alarmIn : chimeIn;
    stopSound();
    const t = audioCtx.currentTime + 0.05;

    if(preview){
      // 試聽用的短版，只夠確認音量
      if(kind === 'alarm'){
        // 短版：加速鼓點 + 一記銅管和弦 + 衝擊，只夠確認音量
        let dt = 0, dgap = 0.30;
        while(dt < 1.2){ drum(t + dt, 58, 0.36, 0.28); dt += dgap; dgap *= 0.86; }
        noise(t, 1.3, { peak:0.11, type:'bandpass', freq:280, freqEnd:7000, q:1.4, attack:0.9 });
        const tEnd = t + 1.6;
        subDrop(tEnd, 92, 34, 1.6, 0.42);
        drum(tEnd, 46, 0.5, 0.8);
        noise(tEnd, 1.1, { peak:0.14, type:'highpass', freq:3600, q:0.6, attack:0.004 });
        [[73.42,0.20],[146.83,0.17],[293.66,0.15],[349.23,0.14],[587.33,0.12]]
          .forEach(([f, p], n) => brass(tEnd + n*0.012, 2.0 - n*0.06, f, p));
      }else{
        [1568.0, 1760.0, 1975.5].forEach((f, i) => glass(t + i*0.26, f, 0.30));
      }
      return;
    }

    if(kind === 'soft'){
      // 三連敲 × 三組，音高微微上行，像杯緣被依序敲過
      const notes = [1568.0, 1760.0, 1975.5];            // G6 A6 B6
      for(let grp = 0; grp < 3; grp++){
        for(let i = 0; i < 3; i++){
          glass(t + grp*1.6 + i*0.26, notes[i], 0.30);
        }
      }

    }else if(kind === 'urgent'){
      // 五連敲 × 五組，比 10 分那組更快更亮，音高一路爬上去
      const notes = [1568.0, 1760.0, 1975.5, 2093.0, 2349.3];
      for(let grp = 0; grp < 5; grp++){
        for(let i = 0; i < 5; i++){
          glass(t + grp*1.9 + i*0.19, notes[i], 0.28 + grp*0.02);
        }
      }

    }else{
      const SPAN = 10;
      // ── 音高表（D 小調）──
      const D1=36.71, D2=73.42, A1=55.00, Bb1=58.27, G1=49.00;
      const D3=146.83, F3=174.61, A3=220.00, Bb3=233.08, C4=261.63,
            D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00,
            Bb4=466.16, C5=523.25, D5=587.33, F5=698.46, A5=880.00, D6=1174.66;

      const CUT = 9.62;          // 衝擊前的靜默切點
      const GAP = SPAN - CUT;    // 0.38 秒的空白，落點才有重量

      // ── 層 1：太鼓，間隔等比收緊（整段張力的骨架）──
      // 注意：間隔必須有下限，否則等比級數收斂、while 永遠跑不完
      let dt = 0, dgap = 0.78;
      for(let i = 0; i < 400 && dt < CUT; i++){
        const k = dt / CUT;
        drum(t + dt, 62 - k*14, 0.34 + k*0.30, 0.42 - k*0.16);
        if(i % 2 === 1 && k > 0.45) drum(t + dt + dgap*0.5, 78, 0.14, 0.16);  // 中段加入切分
        dt += dgap;
        dgap = Math.max(0.09, dgap*0.90);   // 每一擊快 10%，收到 0.09 秒為止
      }

      // ── 層 2：低頻長音鋪底，從頭撐到切點 ──
      const droneStops = [[D1, 0.16], [D2, 0.13]];
      droneStops.forEach(([f, p]) => organ(t, CUT, f, { peak:p, attack:1.2, release:0.5 }));

      // ── 層 3：弦樂碎弓，2.6 秒進場，越後面越密越高 ──
      const bowPat = [D5, D5, F5, D5];
      let bt = 2.6, bgap = 0.13;
      for(let j = 0; j < 400 && bt < CUT; j++){
        const k = (bt - 2.6) / (CUT - 2.6);
        const accent = (j % 4 === 0) ? 1.5 : 1;
        strings(t + bt, bgap*0.6, bowPat[j % bowPat.length] * (k > 0.6 ? 2 : 1),
                (0.055 + k*0.055) * accent);
        bt += bgap;
        bgap = Math.max(0.055, bgap*0.985);   // 碎弓逐漸加密
      }

      // ── 層 4：銅管和弦，時值遞減（和聲節奏加速）──
      const prog = [
        [[D4, F4, A4],  D2],   // Dm
        [[Bb3, D4, F4], Bb1],  // Bb
        [[G4, Bb4, D5], G1],   // Gm
        [[A4, C5, E4],  A1],   // A
        [[D4, F4, A4],  D2],   // Dm
        [[A4, C5, E4],  A1]    // A → 準備解決
      ];
      let ct = 4.2, clen = 0.95;
      prog.forEach(([notes, bass], n) => {
        if(ct >= CUT) return;
        const k = n / (prog.length - 1);
        const dur = Math.min(clen, CUT - ct);
        brass(t + ct, dur*0.92, bass*2, 0.16 + k*0.06);
        notes.forEach((f, m) => brass(t + ct + m*0.01, dur*0.88, f, 0.13 + k*0.05));
        ct += clen;
        clen *= 0.82;
      });

      // ── 層 5：上升音效，最後 2.6 秒把濾波器一路開到頂 ──
      noise(t + CUT - 2.6, 2.6, {
        peak: 0.13, type:'bandpass', freq: 260, freqEnd: 7800, q: 1.4, attack: 1.6
      });

      // ── 層 6：切點靜默 0.38 秒，然後衝擊 ──
      const tEnd = t + SPAN;
      subDrop(tEnd, 92, 34, 1.9, 0.42);                       // 胸口那一下
      drum(tEnd, 46, 0.5, 0.9);
      noise(tEnd, 1.3, { peak:0.14, type:'highpass', freq:3600, q:0.6, attack:0.004 });
      [[D2,0.20],[D3,0.17],[A3,0.15],[D4,0.15],[F4,0.14],[A4,0.13],[D5,0.12],[A5,0.08],[D6,0.05]]
        .forEach(([f, p], n) => brass(tEnd + n*0.012, 2.6 - n*0.06, f, p));
      organ(tEnd, 3.2, D2, { peak:0.12, attack:0.03, release:1.9 });   // 管風琴留一層當殘響底
    }
  }catch(e){}
}

let toastTimer = null;
function toast(msg, action){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  t.classList.toggle('has-action', !!action);
  const span = document.createElement('span');
  span.className = 'msg';
  span.textContent = msg;
  t.appendChild(span);
  if(action){
    const b = document.createElement('button');
    b.className = 'undo';
    b.textContent = action.label;
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      action.fn();
      t.classList.remove('show');
    });
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 5000);
}

/* 從倒數頁跳去校時：
   項目正在倒數頁時清單裡沒有它，所以先切到設定頁，
   再捲到該列並展開校時面板。 */
function goEdit(b){
  if(!b || !canEdit(b)) return;
  // 項目在倒數頁時清單裡沒有它，先釘住讓它回到設定頁
  editingId = b.id;
  state.view = 'config';
  applyView();
  onTimerSig = '__editing__';     // 強制下次 syncPages 重算
  tick();
  render();
  // render 完才展開，避免被 tick 內部觸發的那次 render 洗掉
  const li = document.querySelector(`li.boss[data-id="${b.id}"]`);
  if(!li) return;
  const btn = li.querySelector('[data-act="edit"]');
  if(btn) btn.click();
  li.scrollIntoView({ block:'center', behavior:'smooth' });
}

/* 校時欄位的讀值與即時預覽 */
function readRemain(box, b){
  const el = box.querySelector('[data-rt]');
  return rtToSeconds(el.value, rtLen(b)) * 1000;
}
function updateRtPreview(li, b){
  const box = li.querySelector('[data-edit]');
  if(!box) return;
  const el = box.querySelector('[data-preview]');
  const remain = readRemain(box, b);
  if(remain <= 0){
    el.textContent = '請輸入大於 0 的時間';
    el.className = 'rtpreview warn';
  }else if(remain > editCycle(b)){
    el.textContent = `超過週期上限 ${b.mode === 'hourly' ? '1 小時' : cycleText(b)}`;
    el.className = 'rtpreview warn';
  }else{
    // hourly 會被對齊到整分，預覽必須套用同樣的換算才不會與結果不符
    const at = b.mode === 'hourly'
      ? Math.round((Date.now() + remain) / 60000) * 60000
      : Date.now() + remain;
    el.textContent = '將於 ' + clockOf(at) + ' 重生';
    el.className = 'rtpreview';
  }
}
document.getElementById('list').addEventListener('input', e=>{
  if(!e.target.hasAttribute('data-rt')) return;
  const li = e.target.closest('li');
  const b = state.bosses.find(x => x.id === li.dataset.id);
  if(!b) return;
  // 碼表式輸入：打字時數字從右邊推進來，退格則整串右移
  e.target.value = fmtRt(e.target.value, rtLen(b));
  const end = e.target.value.length;
  e.target.setSelectionRange(end, end);
  updateRtPreview(li, b);
});

  b.fired = []; b.firedFor = null;          // 重新勾選時可以再次提醒

document.getElementById('list').addEventListener('click', e=>{
  const grp = e.target.closest('button[data-group]');
  if(grp){
    const cat = grp.dataset.group;
    const group = state.bosses.filter(b => (b.cat || 'boss') === cat);
    const turnOn = group.some(b => b.on === false);   // 只要有關著的就全開，否則全關
    group.forEach(b => { b.on = turnOn; b.fired = []; b.firedFor = null; });
    save(); render(); tick();
    toast(turnOn ? '這一組都開啟提醒了' : '這一組都關閉提醒了');
    return;
  }
  const btn = e.target.closest('button'); if(!btn) return;
  const id = e.target.closest('li').dataset.id;
  const b = state.bosses.find(x => x.id === id); if(!b) return;

  if(btn.dataset.act === 'edit'){
    const box = e.target.closest('li').querySelector('[data-edit]');
    box.hidden = !box.hidden;
    if(!box.hidden){
      // 預設帶入目前推算的剩餘時間，方便微調
      const left = Math.max(0, nextSpawn(b) - Date.now());
      const el = box.querySelector('[data-rt]');
      el.value = secondsToRt(left/1000, rtLen(b));
      updateRtPreview(e.target.closest('li'), b);
      el.focus(); el.select();
    }
    return;
  }
  if(btn.dataset.act === 'closeEdit'){
    e.target.closest('li').querySelector('[data-edit]').hidden = true;
    editingId = null; onTimerSig = ''; tick();
    return;
  }
  if(btn.dataset.act === 'applyRemain'){
    const box = e.target.closest('li').querySelector('[data-edit]');
    const remain = readRemain(box, b);
    const cyc = editCycle(b);
    if(remain <= 0){ toast('剩餘時間要大於 0'); return; }
    if(remain > cyc){
      toast(`不能超過週期（${b.mode === 'hourly' ? '1 小時' : cycleText(b)}）`);
      return;
    }
    if(b.mode === 'hourly'){
      // 每整點模式沒有擊殺時間，改成調整「每小時的第幾分」。
      // 重生時刻只能落在整分，因此把目標時刻四捨五入到最近的整分。
      // 注意不能只看 getSeconds() 就進位——那會忽略當下的秒數而多算一分。
      const target = Date.now() + remain;
      const rounded = new Date(Math.round(target / 60000) * 60000);
      b.minute = rounded.getMinutes();
    }else{
      // 下次重生 = 現在 + 剩餘時間；反推擊殺時間讓週期對上
      b.lastKill = Date.now() + remain - b.intervalMs;
    }
    b.fired = []; b.firedFor = null;
    box.hidden = true;
    editingId = null; onTimerSig = '';
    save(); tick(); render();
    toast(`${b.name} 將於 ${clockOf(nextSpawn(b))} 重生`);
    return;
  }
  if(btn.dataset.act === 'kill'){
    b.lastKill = Date.now(); b.warned = b.spawned = null;
    toast(`${b.name} 重新計時`);
  }
  if(btn.dataset.act === 'back'){
    b.lastKill -= 5*60*1000; b.warned = b.spawned = null;
    toast(`${b.name} 擊殺時間往前 5 分鐘`);
  }
  if(btn.dataset.act === 'del'){
    state.bosses = state.bosses.filter(x => x.id !== id);
    render();
  }
  save(); tick();
});

document.getElementById('loadPreset').addEventListener('click', ()=>{
  let added = 0;
  for(const p of PRESET){
    if(state.bosses.some(b => b.name === p.name)) continue;
    const b = { id:'b'+Date.now()+Math.random().toString(36).slice(2,6),
                cat:p.cat, name:p.name, loc:p.loc, mode:p.mode, fired:[], firedFor:null };
    if(p.mode === 'interval'){ b.intervalMs = p.hours*3600*1000; b.lastKill = Date.now(); }
    else if(p.mode === 'hourly'){ b.minute = p.minute; }
    else { b.days = p.days; b.times = p.times; }
    if(p.leads) b.leads = p.leads;
    state.bosses.push(b); added++;
  }
  save(); render(); tick();
  toast(added ? `已加入 ${added} 項行程` : '預設行程都已經在清單裡了');
});

document.getElementById('saveBoss').addEventListener('click', ()=>{
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast('先填 BOSS 名稱'); document.getElementById('fName').focus(); return; }
  const mode = document.getElementById('fMode').value;
  const b = { id:'b'+Date.now(), cat:document.getElementById('fCat').value,
              name, loc:document.getElementById('fLoc').value.trim(),
              mode, fired:[], firedFor:null };

  if(mode === 'interval'){
    const h = +document.getElementById('fHour').value || 0;
    const m = +document.getElementById('fMin').value || 0;
    if(h*60 + m <= 0){ toast('間隔要大於 0'); return; }
    b.intervalMs = (h*3600 + m*60)*1000;
    b.lastKill = Date.now();
  }else if(mode === 'hourly'){
    b.minute = Math.max(0, Math.min(59, +document.getElementById('fMinute').value || 0));
  }else if(mode === 'weekly'){
    if(!pickedDays.length){ toast('至少選一天'); return; }
    const t = document.getElementById('fWTime').value.trim();
    if(!/^\d{1,2}:\d{2}$/.test(t)){ toast('時刻格式像這樣：21:00'); return; }
    b.days = [...pickedDays].sort(); b.times = [t];
  }else{
    const times = document.getElementById('fTimes').value
      .split(/[,，\s]+/).map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s));
    if(!times.length){ toast('時刻格式像這樣：12:00, 20:00'); return; }
    b.times = times;
  }
  state.bosses.push(b);
  const customLeads = document.getElementById('fLeads').value
    .split(/[,，\s]+/).map(s=>parseInt(s,10)).filter(n=>!isNaN(n) && n >= 0);
  if(customLeads.length) b.leads = [...new Set(customLeads)].sort((x,y)=>y-x);
  document.getElementById('fName').value = '';
  document.getElementById('fLoc').value = '';
  document.getElementById('fLeads').value = '';
  document.getElementById('fTimes').value = '';
  save(); render(); tick();
  toast(`已加入 ${name}`);
});

  const mode = state.theme || 'system';

  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  const tc = document.getElementById('themeColor');

}
